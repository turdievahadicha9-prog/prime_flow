<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prime Flow — Биз жөнүндө</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8f5;
            color: #3d2b2b;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #e8a0b8, #c86b85);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        header h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 22px;
        }

        section {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }

        h2 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 30px;
            color: #b04d6a;
        }

        .about-text {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .about-text p {
            margin-bottom: 15px;
        }

        .advantages {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #b04d6a;
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
        }

        .contacts {
            background: #f4dce3;
            border-radius: 25px;
            padding: 35px;
            text-align: center;
        }

        .contacts p {
            margin: 10px 0;
            font-size: 18px;
        }

        footer {
            background: #3d2b2b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 800px) {
            header h1 {
                font-size: 38px;
            }

            .advantages {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .advantages,
            .gallery {
                grid-template-columns: 1fr;
            }

            header {
                padding: 60px 15px;
            }

            header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1 id="company-name">Prime Flow</h1>
    <p id="slogan">Гүлдөр менен өзгөчө сезимдерди тартуулайбыз 🌷</p>
</header>


<section>
    <h2>Биз жөнүндө</h2>

    <div class="about-text">
        <p id="description"></p>

        <p>
            <strong>Тарыхы:</strong>
            <span id="history"></span>
        </p>

        <p>
            <strong>Негизделген жылы:</strong>
            <span id="founded-year"></span>
        </p>

        <p>
            <strong>Миссиябыз:</strong>
            <span id="mission"></span>
        </p>

        <p>
            <strong>Баалуулуктарыбыз:</strong>
            <span id="values"></span>
        </p>
    </div>
</section>


<section>
    <h2>Биздин артыкчылыктар</h2>

    <div class="advantages" id="advantages"></div>
</section>


<section>
    <h2>Галерея</h2>

    <div class="gallery" id="gallery"></div>
</section>


<section>
    <h2>Байланыш</h2>

    <div class="contacts">
        <p>📍 <strong>Дарек:</strong> <span id="address"></span></p>

        <p>📞 <strong>Телефон:</strong> <span id="phone"></span></p>

        <p>📧 <strong>Email:</strong> <span id="email"></span></p>

        <p>🕐 <strong>Иштөө убактысы:</strong> <span id="working-hours"></span></p>
    </div>
</section>


<footer>
    <p>© 2026 Prime Flow 🌷</p>
</footer>


<script>
    fetch('/api/about/')
        .then(response => response.json())
        .then(data => {

            document.getElementById('company-name').textContent =
                data.company_name;

            document.getElementById('slogan').textContent =
                data.slogan;

            document.getElementById('description').textContent =
                data.description;

            document.getElementById('history').textContent =
                data.history;

            document.getElementById('founded-year').textContent =
                data.founded_year;

            document.getElementById('mission').textContent =
                data.mission;

            document.getElementById('values').textContent =
                data.values;

            document.getElementById('address').textContent =
                data.address;

            document.getElementById('phone').textContent =
                data.phone;

            document.getElementById('email').textContent =
                data.email;

            document.getElementById('working-hours').textContent =
                data.working_hours;


            const advantages =
                document.getElementById('advantages');

            data.advantages.forEach(item => {

                advantages.innerHTML += `
                    <div class="card">
                        <h3>🌷 ${item.title}</h3>
                        <p>${item.description}</p>
                    </div>
                `;

            });


            const gallery =
                document.getElementById('gallery');

            data.gallery.forEach(item => {

                gallery.innerHTML += `
                    <div>
                        <img src="${item.image}" alt="${item.title}">
                    </div>
                `;

            });

        })
        .catch(error => {
            console.log('API error:', error);
        });
</script>

</body>
</html>
